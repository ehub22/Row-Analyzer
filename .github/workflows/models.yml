name: Verify pinned model release
on:
  push:
    branches: [arena/b47330c8-row-analyzer]
    paths:
      [
        .github/workflows/models.yml,
        scripts/prepare_models.py,
        models/manifest.json,
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-publication
  cancel-in-progress: false
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install onnx==1.17.0 onnxruntime==1.20.1 numpy==2.2.6
      - name: Retrieve pinned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download model-weights-v1 -D private/models -p '*.onnx'
      - run: python scripts/prepare_models.py
