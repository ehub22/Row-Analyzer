name: Verify and publish model assets
on:
  push:
    branches: [arena/b47330c8-row-analyzer]
    paths: [.github/workflows/models.yml, scripts/prepare_models.py, models/manifest.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: model-publication
  cancel-in-progress: false
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gdown==5.2.0 onnx==1.17.0 onnxruntime==1.20.1 numpy==2.2.6
      - name: Retrieve owner-authorized weights and validate
        env:
          DRIVE_DETECTOR: ${{ vars.DRIVE_DETECTOR || '1YwSPaZHNVjpjPSUyAk7hH_4M__k_Rrfk' }}
          DRIVE_POSE: ${{ vars.DRIVE_POSE || '1DJXPpFoAfqQKEpkPiZCe0FXvwCCcsRhq' }}
        run: python scripts/prepare_models.py --download
      - name: Publish outside Git (immutable, hash-pinned assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view model-weights-v1; then
            gh release create model-weights-v1 --target "$GITHUB_SHA" --title "Pinned YOLOX-L and DWPose weights" --notes "Owner-authorized model assets. See compatibility.json for hash and runtime checks. Upstream Apache-2.0 licenses included. These checks do not establish rowing pose accuracy." --prerelease
          fi
          gh release upload model-weights-v1 private/models/*.onnx private/models/compatibility.json public/licenses/*.txt --clobber
